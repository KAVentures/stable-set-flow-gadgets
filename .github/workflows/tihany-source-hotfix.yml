name: Tihany source hotfix

on:
  push:
    branches:
      - research/tihany-exact-core
    paths:
      - .github/workflows/tihany-source-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tihany-exact-core
      - name: Apply exact one-line validation repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('experiments/tihany/core_search.py')
          text = path.read_text()
          marker = 'def plain_k_colouring('
          i = text.index(marker)
          prefix, tail = text[:i], text[i:]
          old = '    if search():\n'
          new = '    if search(0):\n'
          if tail.count(old) < 1:
              raise SystemExit('expected plain_k_colouring search() call not found')
          tail = tail.replace(old, new, 1)
          updated = prefix + tail
          if updated == text:
              raise SystemExit('no source change made')
          path.write_text(updated)
          PY
          python -m py_compile experiments/tihany/core_search.py
          grep -A24 '^def plain_k_colouring' experiments/tihany/core_search.py | grep -F 'if search(0):'
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/tihany/core_search.py
          git diff --cached --check
          test "$(git diff --cached --numstat | awk '{a+=$1; d+=$2} END {print a+0, d+0}')" = '1 1'
          git commit -m 'Fix plain colouring validation recursion'
          git push origin HEAD:research/tihany-exact-core
      - name: Dispatch exact Tihany workflow on repaired head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run tihany-exact.yml --ref research/tihany-exact-core
