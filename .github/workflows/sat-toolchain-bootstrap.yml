name: SAT toolchain bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sat-toolchain-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Kissat 4.0.4
        run: |
          git clone --depth 1 --branch rel-4.0.4 https://github.com/arminbiere/kissat.git /tmp/kissat
          cd /tmp/kissat
          ./configure
          make -C build -j2
          cp build/kissat "$GITHUB_WORKSPACE/kissat-4.0.4-linux-x86_64"
          "$GITHUB_WORKSPACE/kissat-4.0.4-linux-x86_64" --version
      - name: Build drat-trim
        run: |
          git clone --depth 1 https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          make -C /tmp/drat-trim -j2
          cp /tmp/drat-trim/drat-trim "$GITHUB_WORKSPACE/drat-trim-linux-x86_64"
      - name: Hash binaries
        run: sha256sum kissat-4.0.4-linux-x86_64 drat-trim-linux-x86_64 > SHA256SUMS.sat-tools
      - uses: actions/upload-artifact@v4
        with:
          name: sat-toolchain-linux-x86_64
          path: |
            kissat-4.0.4-linux-x86_64
            drat-trim-linux-x86_64
            SHA256SUMS.sat-tools
          if-no-files-found: error
